plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.localwebapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.localwebapp"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "2.2"
        archivesBaseName = "CouchFlow"
    }

    // Two builds from one codebase.
    //
    // "standard" declares no notification listener, so Play Protect installs it
    // without complaint — the ordinary sideload experience.
    //
    // "messages" adds the listener via app/src/messages/AndroidManifest.xml.
    // Play Protect blocks this one on first install (NOTIFICATION_LISTENER is
    // on its high-risk list) and it must be allowed through manually.
    //
    // Same applicationId and same signing key, so installing "messages" over
    // "standard" is a normal in-place update: projects, folder permissions and
    // settings all survive. Going back is equally an update.
    flavorDimensions "capability"
    productFlavors {
        standard {
            dimension "capability"
            buildConfigField "boolean", "MESSAGE_CAPTURE", "false"
        }
        messages {
            dimension "capability"
            buildConfigField "boolean", "MESSAGE_CAPTURE", "true"
        }
    }

    // Signing credentials come from the environment in CI (set by the build
    // workflow from repository secrets) and fall back to the throwaway debug
    // values for local builds. The keystore file itself is produced by the
    // workflow — it is never committed.
    signingConfigs {
        release {
            def ksFile = file("${rootProject.projectDir}/app/release.keystore")
            if (!ksFile.exists()) {
                ksFile = file("${rootProject.projectDir}/app/debug.keystore")
            }
            storeFile     ksFile
            storePassword System.getenv("CF_KEYSTORE_PASSWORD") ?: "android"
            keyAlias      System.getenv("CF_KEY_ALIAS")         ?: "androiddebugkey"
            keyPassword   System.getenv("CF_KEY_PASSWORD")      ?: "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled      false
            shrinkResources    false
            debuggable         false
            signingConfig      signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.activity:activity-ktx:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
}