---
# Run this ONCE, manually, from the Actions tab. It creates a signing key and
# hands it back as a base64 artifact, which you paste into a repository secret.
# After that, every build is signed with the same key, so new APKs install over
# old ones and your settings, folder permissions and notification access survive
# the update.
#
# Phone-only flow:
#   1. Actions tab -> "Create signing keystore" -> Run workflow.
#   2. Download the artifact, unzip, open keystore.b64.txt, copy all of it.
#   3. Settings -> Secrets and variables -> Actions -> New repository secret:
#        KEYSTORE_B64        = the copied text
#        KEYSTORE_PASSWORD   = the store password you chose below (default: couchflow)
#        KEY_ALIAS           = couchflow
#        KEY_PASSWORD        = same as KEYSTORE_PASSWORD unless you changed it
#   4. Delete this workflow run (••• -> Delete workflow run) so the key material
#      isn't left sitting in your artifacts.
#
# Keep a copy of keystore.b64.txt somewhere safe. Lose it and you can never
# update an installed APK again — only uninstall and reinstall.

name: Create signing keystore

on:
  workflow_dispatch:
    inputs:
      store_password:
        description: 'Keystore password (also used for the key)'
        required: true
        default: 'couchflow'
      alias:
        description: 'Key alias'
        required: true
        default: 'couchflow'

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore couchflow.jks \
            -storetype PKCS12 \
            -storepass "${{ github.event.inputs.store_password }}" \
            -keypass   "${{ github.event.inputs.store_password }}" \
            -alias     "${{ github.event.inputs.alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=CouchFlow, OU=Personal, O=CouchFlow, L=Couch, S=LR, C=US"
          base64 -w 0 couchflow.jks > keystore.b64.txt
          echo "Fingerprint:"
          keytool -list -v -keystore couchflow.jks \
            -storepass "${{ github.event.inputs.store_password }}" | grep SHA256 || true

      - name: Upload keystore
        uses: actions/upload-artifact@v4
        with:
          name: couchflow-keystore
          path: keystore.b64.txt
          retention-days: 1

      - name: Next steps
        run: |
          echo "Download the 'couchflow-keystore' artifact and set these secrets:"
          echo "  KEYSTORE_B64      = contents of keystore.b64.txt"
          echo "  KEYSTORE_PASSWORD = ${{ github.event.inputs.store_password }}"
          echo "  KEY_ALIAS         = ${{ github.event.inputs.alias }}"
          echo "  KEY_PASSWORD      = ${{ github.event.inputs.store_password }}"
          echo "Then delete this workflow run."
